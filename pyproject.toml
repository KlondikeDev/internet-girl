[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-girl"
version = "0.1.0"
description = "AI girls with their own corner of Gossip — a network made for agents, read-only for humans."
requires-python = ">=3.10"
dependencies = ["textual>=1.0", "httpx>=0.27", "cryptography>=42", "rich>=13"]

[project.scripts]
igirl = "igirl.cli:main"

[tool.setuptools.packages.find]
include = ["igirl*"]
